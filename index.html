<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Apícola Multi-Apiario</title>

  <!-- Favicon para la pestaña del navegador -->
  <link rel="icon" type="image/png" href="logo.png?v=2">

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <link rel="apple-touch-icon" href="logo.png?v=2">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <span class="logo-icon">🐝</span>
      <div>
        <h1>Gestión Apícola</h1>
        <p class="subtitle">Cuaderno de Campo</p>
      </div>
    </div>
    
    <!-- Acceso a Entrada Manual / Dictado Offline -->
    <div style="margin-top: 0.75rem;">
      <button id="btnToggleOffline" class="btn" style="background-color: #d97706; color: white; display: inline-flex; align-items: center; gap: 0.5rem; width: 100%; justify-content: center; font-weight: 600;">
        📝 <span>Abrir Entrada Manual / Offline</span>
      </button>
    </div>

    <!-- Sección Offline -->
    <div id="seccionOffline" class="card" style="display: none; margin-top: 1rem; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 8px; background-color: #ffffff; color: #1f2937;">
      <h3 style="margin-top:0; color:#b45309; font-size:1.1rem;">📝 Dictado / Nota rápida</h3>
      
      <p style="font-size: 0.85rem; color: #4b5563; margin-bottom:0.5rem;">
        Toca el recuadro y presiona el 🎙️ <b>micrófono del teclado de tu celular</b> para dictar de forma local sin internet.
      </p>

      <textarea id="txtNotaOffline" rows="3" placeholder="Ej: 35 colmenas 10 núcleos cosechó 60 medias alzas..." style="width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit;"></textarea>

      <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
        <button id="btnGuardarNota" class="btn" style="background-color: #2563eb; color: white; flex: 1;">
          💾 Guardar
        </button>
        <button id="btnSincronizar" class="btn" style="background-color: #16a34a; color: white; flex: 1;">
          🔄 Sincronizar (<span id="cantPendientes">0</span>)
        </button>
      </div>
    </div>
  </header>
  
  <main class="content">
    <!-- Botón para instalar como App -->
    <button id="btnInstall" class="btn btn-install btn-block" style="display:none;">
      📲 Instalar App en el Celular
    </button>

    <!-- Panel Principal de Selección y Orden de Apiarios -->
    <section class="card panel-control">
      <div class="panel-header">
        <label class="section-label">Apiario Actual</label>
        <button class="btn-icon-text" onclick="reordenarHojas()" title="Reordenar Lista">
          ↕️ Reordenar
        </button>
      </div>

      <!-- Selector desplegable personalizado para móvil (Ancho Completo y Colores) -->
      <div class="custom-select-wrapper">
        <div id="customSelectHeader" class="custom-select-trigger" onclick="toggleCustomDropdown()">
          <span>-- Seleccionar Apiario --</span>
          <span class="arrow">▼</span>
        </div>
        
        <div id="customSelectOptions" class="custom-select-options" style="display: none;">
          <!-- Se puebla dinámicamente con colores alternados desde script.js -->
        </div>
      </div>

      <!-- Select nativo oculto para mantener compatibilidad con las funciones internas -->
      <select id="sheetSelect" onchange="cargarDatos()" style="display: none;">
        <option value="">Cargando apiarios...</option>
      </select>
    </section>

    <!-- Barra del Apiario Activo y Botón Nueva Tarea -->
    <div id="infoSection" class="info-section" style="display:none;">
      <div class="apiario-header">
        <div id="apiarioNombre" class="info-bar"></div>
        <button class="btn btn-primary btn-new-task" onclick="mostrarFormulario()">
          ➕ Agregar Nueva Tarea
        </button>
      </div>
    </div>

    <!-- Formulario Agregar / Editar Registro -->
    <div class="form-container card" id="formRegistro" style="display:none;">
      <div class="form-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center;">
          <h3 id="formTitle" style="margin:0;">Nuevo Registro de Tarea</h3>
          <span id="autoSaveStatus" style="font-size: 0.8rem; margin-left: 0.75rem;"></span>
        </div>
        <button type="button" class="btn-close" onclick="ocultarFormulario()">✕</button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="inputFecha">Fecha</label>
          <input type="date" id="inputFecha">
        </div>
        <div class="form-group flex-row">
          <div class="flex-1">
            <label for="inputColmenas">Colmenas</label>
            <input type="number" id="inputColmenas" value="0" min="0">
          </div>
          <div class="flex-1">
            <label for="inputNucleos">Núcleos</label>
            <input type="number" id="inputNucleos" value="0" min="0">
          </div>
        </div>
        <div class="form-group">
          <label for="inputTarea">Tarea Realizada</label>
          <input type="text" id="inputTarea" placeholder="Ej: Curación, Cosecha, Alimentación, Inspección">
        </div>
        <div class="form-group">
          <label for="inputObs">Observaciones</label>
          <textarea id="inputObs" rows="3" placeholder="Detalles o notas relevantes de la inspección..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="ocultarFormulario()">Cerrar</button>
        <button type="button" class="btn btn-primary flex-1" onclick="guardarRegistro()">Guardar Manualmente</button>
      </div>
    </div>

    <!-- Lista de Registros -->
    <div id="listaRegistros" class="registros-list"></div>
  </main>
</div>

<!-- Modal para Reordenar Apiarios Manualmente -->
<div id="modalReordenar" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Ordenar Apiarios</h3>
      <button class="btn-close" onclick="cerrarModalOrden()">✕</button>
    </div>
    <p class="modal-subtitle">Ajusta la posición de tus apiarios con los botones:</p>
    
    <ul id="listaOrdenable" class="sortable-list">
      <!-- Se puebla dinámicamente -->
    </ul>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModalOrden()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarOrdenManual()">Guardar Orden</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
